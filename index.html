<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18"><title>Somewhere on the Internet</title>
<style>
:root{color-scheme:dark;--ink:#f1f5ff;--muted:#9ca9c5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b18;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}body:before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#24335c45,transparent 55%),linear-gradient(135deg,#090c1b,#0c1227 70%,#080b18);pointer-events:none}.shell{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(22px,4vw,58px);pointer-events:none}.shell .spark{position:absolute;top:clamp(22px,4vw,58px);left:clamp(22px,4vw,58px);font-size:1.35rem}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:.78rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}.brand span{color:#93c5fd}.status,.bottom{font-size:.75rem;letter-spacing:.1em;color:var(--muted)}.status i{display:inline-block;width:7px;height:7px;background:#80f0c4;border-radius:50%;margin-right:9px;box-shadow:0 0 14px #80f0c4}.hero{text-align:center;transform:translateY(-3vh);max-width:850px;margin:auto}.eyebrow{text-transform:uppercase;letter-spacing:.32em;color:#9eb6e9;font-size:.72rem;font-weight:700;margin-bottom:22px}.hero h1{font-size:clamp(3.2rem,9vw,7.5rem);line-height:.98;letter-spacing:-.075em;margin:0 0 25px;font-weight:750}.hero h1 em{font-style:normal;background:linear-gradient(110deg,#f6f8ff 12%,#a8bfff 60%,#8be8f1);background-clip:text;-webkit-background-clip:text;color:transparent}.hero p{max-width:520px;margin:0 auto;color:#b3bfd8;line-height:1.7;font-size:clamp(.95rem,1.6vw,1.1rem)}.hint{margin-top:33px;font-size:.76rem;color:#8396bb;letter-spacing:.08em}.spark{display:inline-block;cursor:pointer;pointer-events:auto;color:#b8c9ff;transition:transform .2s,text-shadow .2s;user-select:none}.spark:hover{transform:rotate(25deg) scale(1.4);text-shadow:0 0 20px #9bafff}.bottom .right{opacity:.65}.overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;background:#050818cc;backdrop-filter:blur(12px);padding:25px;opacity:0;visibility:hidden;transition:.35s}.overlay.show{opacity:1;visibility:visible}.secret{text-align:center;max-width:540px}.secret .glyph{font-size:4rem;filter:drop-shadow(0 0 25px #8ba6ff);cursor:pointer;user-select:none;transition:transform .2s,filter .2s}
.secret .glyph:hover,.secret .glyph:focus-visible{transform:scale(1.2);filter:drop-shadow(0 0 35px #c8d7ff);outline:none}
#singularity{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(circle at 50% 50%,transparent 0%,#02030a70 75%)}
#singularity.active{opacity:1}.secret h2{cursor:pointer;user-select:none;transition:transform .2s,filter .2s}.secret h2:hover,.secret h2:focus-visible{transform:scale(1.25);filter:drop-shadow(0 0 24px #ffb1e7);outline:none}.secret h2{font-size:clamp(2rem,6vw,3.5rem);letter-spacing:-.05em;margin:12px 0}.secret p{color:#aebbd5;line-height:1.6}.secret button{margin-top:20px;background:#c8d7ff;color:#10182e;border:0;border-radius:50px;padding:13px 25px;font-weight:800;cursor:pointer}.secret button:hover{background:white}@media(max-width:600px){.status{display:none}.bottom .right{display:none}.hero{transform:translateY(-1vh)}.eyebrow{letter-spacing:.2em}}

/* LinkedIn stays at bottom-left; the tiny Abby planet sits at bottom-right. */
/* Subtle independent oscillation of the LinkedIn planet's rings. */
.linkedin-ring-back,.linkedin-ring-front{transform-origin:22px 22px;animation:ring-sway 1.25s ease-in-out infinite alternate}
.linkedin-ring-front{animation-delay:-.12s}
@keyframes ring-sway{from{transform:rotate(-8deg) scaleY(.92)}to{transform:rotate(9deg) scaleY(1.08)}}
@media (prefers-reduced-motion:reduce){.linkedin-ring-back,.linkedin-ring-front{animation:none}}
.secret-planets{position:absolute;bottom:clamp(18px,4vw,45px);left:clamp(18px,4vw,45px);display:flex;align-items:center;gap:14px}
.secret-planet{display:grid;place-items:center;width:42px;height:42px;padding:0;border:0;border-radius:50%;background:transparent;color:inherit;text-decoration:none;cursor:pointer;opacity:.46;transition:opacity .2s,transform .2s,filter .2s}
.secret-planet:hover,.secret-planet:focus-visible{opacity:1;transform:translateY(-5px) rotate(-12deg);filter:drop-shadow(0 0 12px #9ab5ff);outline:2px solid #8ba6ff;outline-offset:3px}
.secret-planet svg{width:33px;height:33px;overflow:visible}
/* Position Abby independently at the opposite corner of the Easter egg overlay. */
#abby-planet{position:fixed;left:auto;right:clamp(18px,4vw,45px);bottom:clamp(18px,4vw,45px);width:21px;height:21px;opacity:.30;margin:0}
#abby-planet svg{width:16.5px;height:16.5px}
#abby-planet:hover,#abby-planet:focus-visible{opacity:1}
.love-message{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#050818e8;backdrop-filter:blur(16px);visibility:hidden;opacity:0;transition:opacity .3s,visibility .3s;padding:24px}
.love-message.show{visibility:visible;opacity:1}
.love-card{text-align:center;max-width:90vw}
.love-heart{font-size:clamp(4rem,13vw,8rem);color:#ff87bc;filter:drop-shadow(0 0 35px #ff6fae);animation:heartbeat 1.4s ease-in-out infinite}
.love-card p{font-size:clamp(1.6rem,6vw,3.6rem);font-weight:650;letter-spacing:-.04em;margin:14px 0;color:#ffe4f1}
.love-return{margin-top:26px;padding:10px 18px;border:1px solid #ffadd35e;border-radius:30px;background:#ffadd315;color:#ffe4f1;cursor:pointer}
@keyframes heartbeat{0%,100%{transform:scale(1)}45%{transform:scale(1.14)}}
</style>
</head>
<body>
<canvas id="stars" aria-label="Interactive glowing particle field"></canvas>
<main class="shell" aria-label="Interactive particle universe"><span class="spark" id="spark" role="button" tabindex="0" aria-label="Secret sparkle, activate five times">✦</span></main>
<div id="singularity" aria-hidden="true"></div><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="secret-title"><div class="secret"><div class="glyph" id="blackhole" role="button" tabindex="0" aria-label="Activate black hole" title="Touch the star">✧</div><h2 id="secret-title" role="button" tabindex="0" aria-label="Activate meteor storm" title="Summon a meteor storm">✦</h2></div><div class="secret-planets" aria-label="Hidden planets">
<a class="secret-planet" href="https://www.linkedin.com/in/sam-carts" target="_blank" rel="noopener noreferrer" aria-label="Visit Sam's LinkedIn" title="A distant connection">
<svg viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="planetBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#93c5ff"/><stop offset="1" stop-color="#4551a4"/></linearGradient></defs><g class="linkedin-ring-back"><ellipse cx="22" cy="22" rx="21" ry="7" fill="none" stroke="#8aabeb" stroke-width="2.2" transform="rotate(-24 22 22)"/></g><circle cx="22" cy="22" r="12" fill="url(#planetBlue)"/><path d="M12 19c6 3 12 3 20-2M13 26c8 2 14 1 19-2" stroke="#c1d9ff" stroke-opacity=".5" fill="none" stroke-width="1.8"/><g class="linkedin-ring-front"><path d="M2 30c10 1 29-7 40-16" stroke="#d5e4ff" stroke-width="2" fill="none"/></g></svg>
</a>
<button class="secret-planet" id="abby-planet" type="button" aria-label="Open a secret message" title="A little planet with a secret">
<svg viewBox="0 0 44 44" aria-hidden="true"><defs><linearGradient id="planetPink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc1e4"/><stop offset="1" stop-color="#9a519f"/></linearGradient></defs><ellipse cx="22" cy="22" rx="21" ry="7" fill="none" stroke="#c89bdf" stroke-width="2.2" transform="rotate(20 22 22)"/><circle cx="22" cy="22" r="12" fill="url(#planetPink)"/><path d="M13 18c6 2 12 3 19 0M12 25c8 3 15 2 20 0" stroke="#ffe5f5" stroke-opacity=".5" fill="none" stroke-width="1.7"/><path d="M2 14c12 10 29 15 40 16" stroke="#ffe0fa" stroke-width="2" fill="none"/></svg>
</button></div></div>
<div class="love-message" id="love-message" role="dialog" aria-modal="true" aria-label="Secret message" aria-hidden="true"><div class="love-card"><div class="love-heart" aria-hidden="true">♥</div><p>I like Abby</p><button class="love-return" id="love-return" type="button">Return to the stars ✦</button></div></div>
<script>
(()=>{
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d'),spark=document.getElementById('spark'),overlay=document.getElementById('overlay');let w,h,dpr,particles=[],bursts=[],last=0,secretMode=false,blackHole=null,meteorStorm=null;const pointer={x:-1000,y:-1000};
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const count=Math.min(180,Math.max(65,Math.round(w*h/9000)));particles=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.8+.5,a:Math.random()*.55+.25,phase:Math.random()*6.28}));}
function draw(t){const dt=Math.min((t-last)/16.67||1,3);last=t;ctx.clearRect(0,0,w,h);
if(meteorStorm){const elapsed=t-meteorStorm.start;if(elapsed>6500){meteorStorm=null;secretMode=false;}else{
const palette=['#8deaff','#f4a7ff','#ffc78a','#ffffff','#9ca7ff'];
if(Math.random()<.22*dt && meteorStorm.meteors.length<42){meteorStorm.meteors.push({x:Math.random()*w*1.4-w*.2,y:-70-Math.random()*h*.4,vx:-3-Math.random()*6,vy:7+Math.random()*9,len:55+Math.random()*130,color:palette[Math.floor(Math.random()*palette.length)]});}
for(const m of meteorStorm.meteors){m.x+=m.vx*dt;m.y+=m.vy*dt;const mag=Math.hypot(m.vx,m.vy);const tailX=m.x-m.vx/mag*m.len,tailY=m.y-m.vy/mag*m.len;const g=ctx.createLinearGradient(tailX,tailY,m.x,m.y);g.addColorStop(0,'#ffffff00');g.addColorStop(1,m.color);ctx.strokeStyle=g;ctx.lineWidth=1.4;ctx.shadowBlur=16;ctx.shadowColor=m.color;ctx.beginPath();ctx.moveTo(tailX,tailY);ctx.lineTo(m.x,m.y);ctx.stroke();}
ctx.shadowBlur=0;meteorStorm.meteors=meteorStorm.meteors.filter(m=>m.y<h+200&&m.x>-250);
if(elapsed>5600){meteorStorm.meteors=[];}
}}
if(blackHole){const elapsed=t-blackHole.start;const cx=w/2,cy=h/2;
if(elapsed>5100){blackHole=null;document.getElementById('singularity').classList.remove('active');secretMode=false;}
else{const pull=elapsed<2500,flash=elapsed>=2500&&elapsed<3100;
const halo=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.35);
halo.addColorStop(0,flash?'#f4f9ffbb':'#000000');halo.addColorStop(.10,flash?'#9bcaff77':'#070917');halo.addColorStop(.25,flash?'#6d95ff25':'#4c67c522');halo.addColorStop(1,'#00000000');
ctx.fillStyle=halo;ctx.fillRect(0,0,w,h);
if(pull){ctx.beginPath();ctx.arc(cx,cy,Math.max(8,22*(1-elapsed/2500)),0,Math.PI*2);ctx.fillStyle='#020208';ctx.shadowBlur=30;ctx.shadowColor='#8caaff';ctx.fill();ctx.shadowBlur=0;}
}}
for(const p of particles){if(blackHole){const elapsed=t-blackHole.start,dx=w/2-p.x,dy=h/2-p.y,dist=Math.max(1,Math.hypot(dx,dy));if(elapsed<2500){const strength=(.12+elapsed/2500*.9)*dt;p.vx+=dx/dist*strength;p.vy+=dy/dist*strength;p.vx*=.98;p.vy*=.98;}else if(!blackHole.exploded){blackHole.exploded=true;for(const q of particles){const angle=Math.atan2(q.y-h/2,q.x-w/2)+(Math.random()-.5)*1.1;q.x=w/2+(Math.random()-.5)*18;q.y=h/2+(Math.random()-.5)*18;const power=5+Math.random()*12;q.vx=Math.cos(angle)*power;q.vy=Math.sin(angle)*power;}bursts.push({x:w/2,y:h/2,r:3,life:90});}else{p.vx*=.992;p.vy*=.992;}p.x+=p.vx*dt;p.y+=p.vy*dt;const a=p.a*(.75+.25*Math.sin(t*.0015+p.phase));ctx.beginPath();ctx.arc(p.x,p.y,p.r*(elapsed>=2500?1.6:1),0,Math.PI*2);ctx.fillStyle=`rgba(180,216,255,${a})`;ctx.shadowBlur=18;ctx.shadowColor='#92baff';ctx.fill();continue;}const dx=p.x-pointer.x,dy=p.y-pointer.y,dist=Math.hypot(dx,dy);if(dist<170&&dist>0){const force=(170-dist)/170*.09;p.vx+=dx/dist*force*dt;p.vy+=dy/dist*force*dt;}p.vx*=.995;p.vy*=.995;const speed=Math.hypot(p.vx,p.vy);if(speed>1.4){p.vx=p.vx/speed*1.4;p.vy=p.vy/speed*1.4;}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<-5)p.x=w+5;if(p.x>w+5)p.x=-5;if(p.y<-5)p.y=h+5;if(p.y>h+5)p.y=-5;const a=p.a*(.75+.25*Math.sin(t*.0015+p.phase));ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${secretMode?'163,255,218':'170,196,255'},${a})`;ctx.shadowBlur=12;ctx.shadowColor=secretMode?'#8affd9':'#7c9bff';ctx.fill();}ctx.shadowBlur=0;for(let i=0;i<particles.length;i++){const a=particles[i];for(let j=i+1;j<particles.length;j++){const b=particles[j],dist=Math.hypot(a.x-b.x,a.y-b.y);if(dist<105){ctx.strokeStyle=`rgba(${secretMode?'116,255,202':'120,154,245'},${(1-dist/105)*.13})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}}bursts=bursts.filter(b=>b.life>0);for(const b of bursts){b.life-=dt;b.r+=2.8*dt;ctx.strokeStyle=`rgba(180,208,255,${Math.max(0,b.life/40)*.55})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();}requestAnimationFrame(draw);}
function startMeteorStorm(){if(blackHole||meteorStorm)return;overlay.classList.remove('show');pointer.x=-1000;pointer.y=-1000;secretMode=true;meteorStorm={start:performance.now(),meteors:[]};for(const p of particles){p.vx+=(Math.random()-.5)*2;p.vy+=(Math.random()-.5)*2;}}
const meteorIcon=document.getElementById('secret-title');meteorIcon.addEventListener('click',startMeteorStorm);meteorIcon.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();startMeteorStorm();}});
function startBlackHole(){if(blackHole||meteorStorm)return;overlay.classList.remove('show');pointer.x=-1000;pointer.y=-1000;secretMode=true;blackHole={start:performance.now(),exploded:false};document.getElementById('singularity').classList.add('active');}
const glyph=document.getElementById('blackhole');glyph.addEventListener('click',startBlackHole);glyph.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();startBlackHole();}});
const loveMessage=document.getElementById('love-message');
const loveReturn=document.getElementById('love-return');
document.getElementById('abby-planet').addEventListener('click',()=>{overlay.classList.remove('show');loveMessage.classList.add('show');loveMessage.setAttribute('aria-hidden','false');loveReturn.focus();});
loveReturn.addEventListener('click',()=>{loveMessage.classList.remove('show');loveMessage.setAttribute('aria-hidden','true');secretMode=false;spark.focus();});
function reveal(){if(blackHole||meteorStorm||loveMessage.classList.contains('show'))return;secretMode=true;overlay.classList.add('show');document.getElementById('blackhole').focus();}function close(){overlay.classList.remove('show');secretMode=false;spark.focus();}let taps=0,tapTimer;function poke(){taps++;spark.style.transform=`rotate(${taps*35}deg) scale(1.3)`;clearTimeout(tapTimer);tapTimer=setTimeout(()=>{taps=0;spark.style.transform=''},1800);if(taps>=5){taps=0;reveal();}}spark.addEventListener('click',poke);spark.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poke();}});const konami=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let keys=[];addEventListener('keydown',e=>{keys.push(e.key);keys=keys.slice(-10);if(keys.join('|')===konami.join('|'))reveal();});addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;},{passive:true});addEventListener('pointerleave',()=>{pointer.x=-1000;pointer.y=-1000;});addEventListener('pointerdown',e=>{if(e.target===canvas||e.target.closest('.shell'))bursts.push({x:e.clientX,y:e.clientY,r:5,life:40});});addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script>
</body></html>
